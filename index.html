<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mosquito Smash" />
  <meta name="theme-color" content="#1e1b4b" />
  <title>Mosquito Smash</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1a1638;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #1d1a42 0%, #2c2763 45%, #3d357a 70%, #241e4d 100%);
    }

    .window {
      position: absolute;
      top: 12%;
      right: 8%;
      width: 110px;
      height: 140px;
      background: linear-gradient(180deg, #0b132b 0%, #1c2541 100%);
      border: 6px solid #4a3b32;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(255, 244, 179, 0.15);
      overflow: hidden;
      z-index: 1;
    }
    .window::before, .window::after {
      content: "";
      position: absolute;
      background: #4a3b32;
      z-index: 2;
    }
    .window::before { top: 50%; left: 0; width: 100%; height: 4px; transform: translateY(-50%); }
    .window::after { left: 50%; top: 0; width: 4px; height: 100%; transform: translateX(-50%); }
    .moon {
      position: absolute;
      top: 16px;
      left: 18px;
      width: 28px;
      height: 28px;
      background: #fef08a;
      border-radius: 50%;
      box-shadow: 0 0 12px #fef08a;
    }

    .lamp {
      position: absolute;
      bottom: 24%;
      left: 6%;
      z-index: 2;
    }
    .lamp-shade {
      width: 54px;
      height: 36px;
      background: #f59e0b;
      clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.5);
    }
    .lamp-stand {
      width: 8px;
      height: 32px;
      background: #78350f;
      margin: 0 auto;
    }
    .lamp-base {
      width: 30px;
      height: 8px;
      background: #451a03;
      border-radius: 4px;
      margin: 0 auto;
    }

    .bed-headboard {
      position: absolute;
      bottom: 16%;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 460px;
      height: 110px;
      background: linear-gradient(180deg, #7c2d12, #5c1f0c);
      border-radius: 22px 22px 0 0;
      border: 4px solid #431407;
      z-index: 2;
    }
    .pillow {
      position: absolute;
      bottom: 18%;
      width: 32%;
      max-width: 150px;
      height: 45px;
      background: #f8fafc;
      border-radius: 16px;
      box-shadow: inset 0 -5px 0 #cbd5e1;
      z-index: 3;
    }
    .pillow.left { left: 16%; }
    .pillow.right { right: 16%; }
    .blanket {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 500px;
      height: 20%;
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      border-top: 14px solid #93c5fd;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.35);
      z-index: 4;
    }

    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      left: 0;
      width: 100%;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .hud-group {
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }
    .badge {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }
    .icon-btn {
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:active { transform: scale(0.92); }

    #play-area {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .mosquito {
      position: absolute;
      width: 72px;
      height: 72px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: hoverBob 0.4s infinite alternate ease-in-out;
    }
    .mosquito svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 6px 6px rgba(0,0,0,0.4));
    }
    .wing-left {
      transform-origin: 48px 42px;
      animation: flapLeft 0.08s infinite alternate;
    }
    .wing-right {
      transform-origin: 52px 42px;
      animation: flapRight 0.08s infinite alternate;
    }

    @keyframes flapLeft {
      0% { transform: rotate(-18deg) scaleY(1); }
      100% { transform: rotate(22deg) scaleY(0.7); }
    }
    @keyframes flapRight {
      0% { transform: rotate(18deg) scaleY(1); }
      100% { transform: rotate(-22deg) scaleY(0.7); }
    }
    @keyframes hoverBob {
      0% { margin-top: -4px; }
      100% { margin-top: 4px; }
    }

    .splat {
      position: absolute;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
      z-index: 15;
      font-weight: 900;
      font-size: 22px;
      color: #fde047;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      animation: popFade 0.65s forwards ease-out;
    }
    @keyframes popFade {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
      40% { opacity: 1; transform: translate(-50%, -90%) scale(1.25); }
      100% { opacity: 0; transform: translate(-50%, -130%) scale(1); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 12, 41, 0.82);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 30;
      color: #fff;
    }
    .hidden { display: none !important; }

    .card {
      background: linear-gradient(180deg, #272259 0%, #1a163d 100%);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 28px 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.55);
    }

    .game-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fde047, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .stats-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-around;
    }
    .stat-item span {
      display: block;
      font-size: 12px;
      color: #94a3b8;
    }
    .stat-item strong {
      font-size: 24px;
      color: #fde047;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      color: #1e1b4b;
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b45309, 0 12px 20px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    .btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b45309;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #e2e8f0;
    }
    .legend div {
      background: rgba(255,255,255,0.08);
      padding: 6px 10px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <!-- Bedroom Environment -->
    <div class="window"><div class="moon"></div></div>
    <div class="lamp">
      <div class="lamp-shade"></div>
      <div class="lamp-stand"></div>
      <div class="lamp-base"></div>
    </div>
    <div class="bed-headboard"></div>
    <div class="pillow left"></div>
    <div class="pillow right"></div>
    <div class="blanket"></div>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-group">
        <div class="badge">🎯 <span id="score-val">0</span></div>
        <div class="badge">🏆 <span id="best-hud">0</span></div>
      </div>
      <div class="hud-group">
        <div class="badge" id="lives-val">❤️❤️❤️</div>
        <div class="badge">⏱️ <span id="time-val">60</span>s</div>
        <button class="icon-btn" id="sound-btn" aria-label="Mute or Unmute">🔊</button>
        <button class="icon-btn" id="pause-btn" aria-label="Pause Game">⏸️</button>
      </div>
    </div>

    <!-- Interactive Mosquito Layer -->
    <div id="play-area"></div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <div class="card">
        <div style="font-size: 54px; margin-bottom: 6px;">🦟💥</div>
        <h1 class="game-title">MOSQUITO SMASH</h1>
        <p class="subtitle">Tap mosquitoes before they escape! Protect your bedroom sleep.</p>
        <div class="legend">
          <div>🦟 Normal (+1)</div>
          <div>⚡ Fast (+1)</div>
          <div>👑 Giant (+1)</div>
        </div>
        <div class="stats-box">
          <div class="stat-item">
            <span>BEST SCORE</span>
            <strong id="start-best">0</strong>
          </div>
        </div>
        <button class="btn-primary" id="start-btn">START GAME</button>
      </div>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="overlay hidden">
      <div class="card">
        <h2 class="game-title" style="font-size: 28px;">GAME PAUSED</h2>
        <p class="subtitle">Take a breath! Mosquitoes are waiting.</p>
        <button class="btn-primary" id="resume-btn">RESUME</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="card">
        <div style="font-size: 48px; margin-bottom: 6px;">😵🦟</div>
        <h2 class="game-title" style="font-size: 30px;">GAME OVER</h2>
        <p class="subtitle" id="gameover-reason">Time's up!</p>
        <div class="stats-box">
          <div class="stat-item">
            <span>YOUR SCORE</span>
            <strong id="final-score">0</strong>
          </div>
          <div class="stat-item">
            <span>BEST SCORE</span>
            <strong id="final-best">0</strong>
          </div>
        </div>
        <button class="btn-primary" id="restart-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script>
    // Register Service Worker for Offline PWA Support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // Game State Variables
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('mosquito_best_score') || '0', 10);
    let lives = 3;
    let timeLeft = 60;
    let isPlaying = false;
    let isPaused = false;
    let soundEnabled = true;

    let spawnTimer = null;
    let countdownTimer = null;
    let animFrameId = null;
    let mosquitoes = [];

    // DOM Elements
    const playArea = document.getElementById('play-area');
    const scoreVal = document.getElementById('score-val');
    const bestHud = document.getElementById('best-hud');
    const startBest = document.getElementById('start-best');
    const livesVal = document.getElementById('lives-val');
    const timeVal = document.getElementById('time-val');
    const soundBtn = document.getElementById('sound-btn');
    const pauseBtn = document.getElementById('pause-btn');

    const startScreen = document.getElementById('start-screen');
    const pauseScreen = document.getElementById('pause-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const finalScore = document.getElementById('final-score');
    const finalBest = document.getElementById('final-best');
    const gameoverReason = document.getElementById('gameover-reason');

    bestHud.textContent = bestScore;
    startBest.textContent = bestScore;

    // Web Audio API Synthesizer (No external MP3 files required!)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSlapSound() {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playMissSound() {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(95, audioCtx.currentTime + 0.22);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    function playGameOverSound() {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // Create Original SVG Cartoon Mosquito
    function createMosquitoSVG(type) {
      let bodyColor = '#334155';
      let stripeColor = '#94a3b8';
      let eyeColor = '#ef4444';
      if (type === 'fast') {
        bodyColor = '#b91c1c';
        stripeColor = '#fca5a5';
        eyeColor = '#fde047';
      } else if (type === 'giant') {
        bodyColor = '#6d28d9';
        stripeColor = '#c4b5fd';
        eyeColor = '#34d399';
      }

      return `
        <svg viewBox="0 0 100 100">
          <!-- Legs -->
          <path d="M42 58 L25 78 L18 75 M58 58 L75 78 L82 75 M40 50 L20 62 M60 50 L80 62" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Animated Wings -->
          <ellipse class="wing-left" cx="32" cy="36" rx="18" ry="8" fill="rgba(255,255,255,0.75)" stroke="#cbd5e1" stroke-width="1.5"/>
          <ellipse class="wing-right" cx="68" cy="36" rx="18" ry="8" fill="rgba(255,255,255,0.75)" stroke="#cbd5e1" stroke-width="1.5"/>
          <!-- Needle Proboscis -->
          <polygon points="48,25 52,25 50,6" fill="#0f172a"/>
          <!-- Abdomen -->
          <ellipse cx="50" cy="64" rx="11" ry="18" fill="${bodyColor}"/>
          <path d="M40 60 Q50 64 60 60 M41 68 Q50 72 59 68" stroke="${stripeColor}" stroke-width="2.5" fill="none"/>
          <!-- Thorax & Head -->
          <circle cx="50" cy="43" r="10" fill="${bodyColor}"/>
          <circle cx="50" cy="29" r="8" fill="${bodyColor}"/>
          <!-- Cartoon Eyes -->
          <circle cx="46" cy="27" r="3.5" fill="${eyeColor}"/>
          <circle cx="54" cy="27" r="3.5" fill="${eyeColor}"/>
          <circle cx="46" cy="27" r="1.5" fill="#000"/>
          <circle cx="54" cy="27" r="1.5" fill="#000"/>
        </svg>
      `;
    }

    function updateHUD() {
      scoreVal.textContent = score;
      bestHud.textContent = bestScore;
      timeVal.textContent = timeLeft;
      livesVal.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
    }

    function showSplat(x, y, text) {
      const el = document.createElement('div');
      el.className = 'splat';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.textContent = text;
      playArea.appendChild(el);
      setTimeout(() => el.remove(), 650);
    }

    function spawnMosquito() {
      if (!isPlaying || isPaused) return;

      const width = window.innerWidth;
      const height = window.innerHeight;
      const padding = 55;

      // Difficulty scaling based on elapsed time & score
      const difficulty = Math.min(2.6, 1 + (60 - timeLeft) * 0.025 + score * 0.015);

      const rand = Math.random();
      let type = 'normal';
      let speed = 1.6 * difficulty;
      let size = 72;
      let lifeDuration = Math.max(1600, 3400 - difficulty * 550);

      if (rand > 0.72) {
        type = 'fast';
        speed = 2.8 * difficulty;
        size = 64;
        lifeDuration = Math.max(1400, 2800 - difficulty * 450);
      } else if (rand > 0.5) {
        type = 'giant';
        speed = 1.2 * difficulty;
        size = 88;
      }

      const x = padding + Math.random() * (width - padding * 2);
      const y = 90 + Math.random() * (height - 190);
      const angle = Math.random() * Math.PI * 2;

      const el = document.createElement('div');
      el.className = 'mosquito';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.innerHTML = createMosquitoSVG(type);

      const mObj = {
        el,
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size,
        born: Date.now(),
        lifeDuration,
        smashed: false
      };

      const handleHit = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!isPlaying || isPaused || mObj.smashed) return;
        mObj.smashed = true;

        score += 1;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('mosquito_best_score', bestScore);
        }

        playSlapSound();
        if (navigator.vibrate) navigator.vibrate(35);

        showSplat(mObj.x, mObj.y, '💥 +1');
        el.remove();
        mosquitoes = mosquitoes.filter(m => m !== mObj);
        updateHUD();
      };

      el.addEventListener('pointerdown', handleHit);
      playArea.appendChild(el);
      mosquitoes.push(mObj);
    }

    function scheduleNextSpawn() {
      if (!isPlaying) return;
      const delay = Math.max(420, 1250 - (60 - timeLeft) * 12 - score * 8);
      spawnTimer = setTimeout(() => {
        if (isPlaying && !isPaused) {
          spawnMosquito();
        }
        scheduleNextSpawn();
      }, delay);
    }

    function gameLoop() {
      if (isPlaying && !isPaused) {
        const now = Date.now();
        const width = window.innerWidth;
        const height = window.innerHeight;

        for (let i = mosquitoes.length - 1; i >= 0; i--) {
          const m = mosquitoes[i];
          if (m.smashed) continue;

          // Erratic mosquito flight jitter
          m.vx += (Math.random() - 0.5) * 0.45;
          m.vy += (Math.random() - 0.5) * 0.45;
          m.x += m.vx;
          m.y += m.vy;

          // Bounce off screen edges
          if (m.x < 40) { m.x = 40; m.vx *= -1; }
          if (m.x > width - 40) { m.x = width - 40; m.vx *= -1; }
          if (m.y < 80) { m.y = 80; m.vy *= -1; }
          if (m.y > height - 90) { m.y = height - 90; m.vy *= -1; }

          m.el.style.left = m.x + 'px';
          m.el.style.top = m.y + 'px';

          // Check if mosquito escaped (missed)
          if (now - m.born > m.lifeDuration) {
            m.el.remove();
            mosquitoes.splice(i, 1);
            lives -= 1;
            playMissSound();
            showSplat(m.x, m.y, '💨 -1 ❤️');
            updateHUD();

            if (lives <= 0) {
              endGame('Too many mosquitoes escaped!');
              return;
            }
          }
        }
      }
      animFrameId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      initAudio();
      score = 0;
      lives = 3;
      timeLeft = 60;
      isPlaying = true;
      isPaused = false;

      mosquitoes.forEach(m => m.el.remove());
      mosquitoes = [];
      playArea.innerHTML = '';

      updateHUD();
      startScreen.classList.add('hidden');
      pauseScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');

      clearTimeout(spawnTimer);
      clearInterval(countdownTimer);
      cancelAnimationFrame(animFrameId);

      spawnMosquito();
      scheduleNextSpawn();
      animFrameId = requestAnimationFrame(gameLoop);

      countdownTimer = setInterval(() => {
        if (!isPlaying || isPaused) return;
        timeLeft -= 1;
        updateHUD();
        if (timeLeft <= 0) {
          endGame("Time's up! Great defense!");
        }
      }, 1000);
    }

    function endGame(reason) {
      isPlaying = false;
      clearTimeout(spawnTimer);
      clearInterval(countdownTimer);
      cancelAnimationFrame(animFrameId);
      playGameOverSound();

      finalScore.textContent = score;
      finalBest.textContent = bestScore;
      gameoverReason.textContent = reason;
      gameoverScreen.classList.remove('hidden');
    }

    // Button Controls
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    });

    pauseBtn.addEventListener('click', () => {
      if (!isPlaying) return;
      isPaused = true;
      pauseScreen.classList.remove('hidden');
    });

    document.getElementById('resume-btn').addEventListener('click', () => {
      isPaused = false;
      // Adjust born timestamps so mosquitoes don't expire immediately after pause
      mosquitoes.forEach(m => m.born = Date.now());
      pauseScreen.classList.add('hidden');
    });
  </script>
</body>
</html>
